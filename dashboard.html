<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB — Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <nav>
    <div>FACEIT MLBB</div>
    <div>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="lobbies.html">Lobbies</a>
      <a href="matchmaking.html">Matchmaking</a>
      <a href="leaderboard.html">Leaderboard</a>
      <button id="btn-logout" class="btn-danger" style="margin-left:16px;">Гарчлах</button>
    </div>
  </nav>

  <div class="container">
    <div class="profile-card">
      <div class="user-info">
        <h2 id="user-ign">Ачаалж байна...</h2>
        <p>MLBB ID: <span id="user-mlbb">-</span></p>
        <p>Имэйл: <span id="user-email">-</span></p>
      </div>
      <div style="text-align: right;">
        <div style="font-size: 42px; font-weight: 800; font-family: 'Rajdhani', sans-serif; color: var(--accent); text-shadow: 0 0 30px var(--accent-glow);" id="user-elo">1000</div>
        <div style="margin-top: 8px;">
          <span class="badge" id="user-level">LEVEL 3</span>
        </div>
        <button class="btn-edit" id="btn-edit-mlbb" style="margin-top: 12px;">✏️ MLBB ID Засах</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box"><h3 id="stat-matches" style="color: var(--text-primary);">0</h3><p>Нийт тоглолт</p></div>
      <div class="stat-box"><h3 id="stat-wins" style="color: var(--success);">0</h3><p>Хожил</p></div>
      <div class="stat-box"><h3 id="stat-losses" style="color: var(--danger);">0</h3><p>Хожигдол</p></div>
      <div class="stat-box"><h3 id="stat-winrate" style="color: var(--warning);">0%</h3><p>Winrate</p></div>
    </div>
  </div>

  <div class="modal" id="edit-modal">
    <div class="modal-content">
      <h3>MLBB Мэдээлэл Засах</h3>
      <input type="text" id="edit-ign" placeholder="Тоглоомын нэр (IGN)">
      <input type="number" id="edit-mlbb-id" placeholder="MLBB User ID">
      <input type="number" id="edit-zone-id" placeholder="Server/Zone ID">
      <div class="modal-actions">
        <button id="btn-cancel-edit" class="btn-secondary">Болих</button>
        <button id="btn-save-edit" class="btn-primary">Хадгалах</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
