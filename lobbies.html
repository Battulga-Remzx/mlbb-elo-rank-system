<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB - Custom Lobbies</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #121214; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
    nav { background: #1a1a1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a30; flex-wrap: wrap; gap: 10px; }
    nav a { color: #aaa; text-decoration: none; margin-left: 20px; font-weight: bold; }
    nav a.active { color: #ff5500; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .create-box { background: #1a1a1e; padding: 20px; border-radius: 12px; border: 1px solid #2a2a30; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
    .btn-create { background: #ff5500; color: #fff; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; }
    .btn-create:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
    .lobby-card { background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 10px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .btn-join { background: #00c853; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>

  <nav>
    <div style="font-weight: bold; color: #ff5500; font-size: 20px;">FACEIT MLBB</div>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="lobbies.html" class="active">Lobbies</a>
      <a href="matchmaking.html">Matchmaking</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="create-box">
      <div>
        <h3 style="margin: 0;">Шинэ Өрөө Нээх</h3>
        <p style="margin: 5px 0 0 0; color: #aaa; font-size: 14px;">Өрөө 5 минут идэвхгүй бол автоматаар хаагдана.</p>
      </div>
      <button id="btn-create-lobby" class="btn-create">➕ ӨРӨӨ НЭЭХ</button>
    </div>

    <h3>Нээлттэй Өрөөнүүд</h3>
    <div id="lobbies-container">
      <p style="color: #666; text-align: center;">Ачаалж байна...</p>
    </div>
  </div>

  <script type="module" src="js/lobbies.js"></script>
</body>
</html>
