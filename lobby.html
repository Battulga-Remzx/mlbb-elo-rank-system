<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>FACEIT MLBB - Lobby</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .lobby-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .team-box { background: #1a1a1e; padding: 20px; border-radius: 10px; border: 1px solid #2a2a30; }
    .slot { background: #25252b; padding: 12px; margin: 8px 0; border-radius: 6px; display: flex; justify-content: space-between; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
    .modal-body { background: #1a1a1e; padding: 20px; width: 90%; height: 80vh; border-radius: 10px; display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">FACEIT MLBB</div>
    <div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="lobby.html" class="active">Lobby</a></div>
  </div>

  <div style="text-align: center; margin-bottom: 20px;">
    <button class="btn-primary" id="btn-open-tool">Moonton Tool Нээх[cite: 1]</button>
    <div id="qr-area" style="margin-top: 15px; display: none;">
      <h4>MATCH ID: <span id="room-id-text" style="color: #ff5500;">-</span></h4>
      <img id="qr-img" src="" style="width: 150px; border: 2px solid #ff5500; border-radius: 8px; margin-top: 10px;">
    </div>
  </div>

  <div class="lobby-grid">
    <div class="team-box" style="border-top: 4px solid #00bfff;"><h3>TEAM BLUE</h3><div id="team-a"></div></div>
    <div class="team-box" style="border-top: 4px solid #ff4500;"><h3>TEAM RED</h3><div id="team-b"></div></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-body">
      <button class="btn-secondary" id="btn-close-modal" style="align-self: flex-end; margin-bottom: 10px;">X Хаах</button>
      <iframe src="https://play.mobilelegends.com" style="width:100%; height:100%; border:none;"></iframe>[cite: 1]
    </div>
  </div>
  <script type="module" src="js/lobby.js"></script>
</body>
</html>
