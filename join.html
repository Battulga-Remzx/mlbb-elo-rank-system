<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Lobby руу орох...</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">

  <div style="background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-elevated)); padding: 48px 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); max-width: 420px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); position: relative; z-index: 1;">
    <div class="spinner"></div>
    <h2 style="justify-content: center; font-size: 24px; margin-bottom: 16px;">MLBB Lobby нээж байна...</h2>
    <p style="color: var(--text-secondary); font-size: 14px;">Хэрэв тоглоом автоматаар нээгдэхгүй бол доорх товчийг дарна уу:</p>

    <div class="match-id-badge" id="display-id" style="margin: 20px 0;">-----</div>
    <br>
    <a id="btn-open-app" class="btn-action" href="#" style="text-decoration: none; display: inline-block; margin: 6px 4px; padding: 12px 24px;">📱 MLBB Апп нээх</a>
    <a id="btn-open-web" class="btn-action" href="#" target="_blank" style="text-decoration: none; display: inline-block; margin: 6px 4px; padding: 12px 24px; background: linear-gradient(135deg, #00aaff, #0088dd);">🌐 Вэбээр орох</a>

    <p style="font-size: 12px; color: var(--text-muted); margin-top: 24px; line-height: 1.6;">
      💡 Хэрэв MLBB апп суулгаагүй бол "Вэбээр орох" товчийг дарж, дараа нь MLBB-ийн "Enter Lobby" товчийг дарна уу.
    </p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get("id");

    if (!matchId) {
      document.querySelector("body > div").innerHTML = `
        <h2 style="color: var(--danger); justify-content: center;">⚠ Алдаа</h2>
        <p style="color: var(--text-secondary);">Match ID олдсонгүй. Линкээ шалгана уу.</p>
      `;
    } else {
      document.getElementById("display-id").innerText = matchId;
      const webUrl = `https://play.mobilelegends.com/match/#/room?id=${matchId}&from=list`;
      const appUrl = `mobilelegends://play.mobilelegends.com/match/#/room?id=${matchId}&from=list`;
      document.getElementById("btn-open-app").href = appUrl;
      document.getElementById("btn-open-web").href = webUrl;

      let appOpened = false;
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) appOpened = true;
      });
      window.location.href = appUrl;
      setTimeout(() => {
        if (!appOpened && !document.hidden) window.location.href = webUrl;
      }, 1500);
    }
  </script>
</body>
</html>
