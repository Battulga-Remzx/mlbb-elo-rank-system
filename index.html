<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB - Login & Register</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 85vh; }
    .auth-card { background: #1a1a1e; padding: 35px; border-radius: 12px; width: 380px; border: 1px solid #2a2a30; }
    .auth-card h2 { text-align: center; color: #ff5500; margin-bottom: 20px; }
    
    .input-group { display: flex; gap: 10px; }
    input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #333; background: #25252b; color: #fff; border-radius: 6px; outline: none; }
    input:focus { border-color: #ff5500; }

    .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; color: #aaa; cursor: pointer; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2 id="form-title">FACEIT LOGIN</h2>

      <!-- Шинээр бүртгүүлэх үед заавал бөгөлөх хэсэг -->
      <div id="signup-fields" style="display: none;">
        <input type="text" id="ign" placeholder="MLBB Тоглоомын нэр (IGN)">
        <div class="input-group">
          <input type="number" id="mlbb-id" placeholder="MLBB ID">
          <input type="number" id="zone-id" placeholder="Server ID" style="width: 130px;">
        </div>
      </div>

      <!-- Имэйл & Нууц үг -->
      <input type="email" id="email" placeholder="Имэйл хаяг" required>
      <input type="password" id="password" placeholder="Нууц үг" required>

      <button class="btn-primary" style="width: 100%; margin-top: 15px;" id="btn-submit">Нэвтрэх</button>
      <div class="toggle-link" id="toggle-btn">Шинээр бүртгүүлэх</div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
