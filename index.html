<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB - Login & Register</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #121214; color: #fff; font-family: sans-serif; margin: 0; }
    .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .auth-card { background: #1a1a1e; padding: 35px; border-radius: 12px; width: 380px; border: 1px solid #2a2a30; }
    .auth-card h2 { text-align: center; color: #ff5500; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #25252b; color: #fff; border-radius: 6px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #ff5500; }
    .btn-primary { background: #ff5500; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 15px; }
    .btn-primary:disabled { background: #555; cursor: not-allowed; }
    .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; color: #aaa; cursor: pointer; }
    .toggle-link:hover { color: #ff5500; }
    .error-box { background: #3a1a1a; border: 1px solid #ff4444; color: #ff8888; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2 id="form-title">FACEIT LOGIN</h2>
      <input type="email" id="email" placeholder="Имэйл хаяг" required autocomplete="email">
      <input type="password" id="password" placeholder="Нууц үг" required autocomplete="current-password">
      <div class="error-box" id="error-box"></div>
      <button class="btn-primary" id="btn-submit">Нэвтрэх</button>
      <div class="toggle-link" id="toggle-btn">Шинээр бүртгүүлэх</div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
