<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB — Login</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <h2 id="form-title">FACEIT LOGIN</h2>
      <input type="email" id="email" placeholder="Имэйл хаяг" required autocomplete="email">
      <input type="password" id="password" placeholder="Нууц үг" required autocomplete="current-password">
      <div class="error-box" id="error-box"></div>
      <button class="btn-primary" id="btn-submit" style="width:100%; margin-top:20px; padding:14px; font-size:15px; letter-spacing:1px;">НЭВТРЭХ</button>
      <div class="toggle-link" id="toggle-btn">Шинээр бүртгүүлэх →</div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
