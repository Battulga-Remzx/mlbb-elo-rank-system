<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT MLBB - Matchmaking</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #121214; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
    nav { background: #1a1a1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a30; flex-wrap: wrap; gap: 10px; }
    nav a { color: #aaa; text-decoration: none; margin-left: 20px; font-weight: bold; }
    nav a.active { color: #ff5500; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .queue-box { background: #1a1a1e; padding: 30px; border-radius: 12px; border: 1px solid #2a2a30; text-align: center; margin-bottom: 30px; }
    .btn-find { background: #ff5500; color: #fff; border: none; padding: 14px 40px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .btn-cancel { background: #333; color: #ff4444; border: 1px solid #ff4444; padding: 14px 40px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .player-list { background: #1a1a1e; border-radius: 12px; border: 1px solid #2a2a30; padding: 20px; }
    .player-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #2a2a30; align-items: center; }
    .player-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <nav>
    <div style="font-weight: bold; color: #ff5500; font-size: 20px;">FACEIT MLBB</div>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="lobbies.html">Lobbies</a>
      <a href="matchmaking.html" class="active">Matchmaking</a>
      <a href="leaderboard.html">Leaderboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="queue-box">
      <h2>5v5 MATCHMAKING</h2>
      <p id="queue-status" style="color: #aaa;">Тоглоом хайж эхлэхийн тулд дараах товчийг дарна уу.</p>
      <button id="btn-toggle-queue" class="btn-find">FIND MATCH</button>
    </div>

    <h3>Дараалалд байгаа тоглогчид (<span id="queue-count">0</span>/10)</h3>
    <div class="player-list" id="player-container">
      <p style="text-align: center; color: #666;">Хүлээгдэж буй тоглогч байхгүй байна.</p>
    </div>
  </div>

  <script type="module" src="js/matchmaking.js"></script>
</body>
</html>
